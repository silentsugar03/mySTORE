<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/cart.css">
    <title>Shopping Cart - mySTORE</title>
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="index.html">mySTORE</a>
            </div>
            <ul class="nav-menu">
                <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="shop.html" class="nav-link">Shop</a></li>
                <li class="nav-item"><a href="cart.html" class="nav-link active">Cart</a></li>
                <li class="nav-item"><a href="#" class="nav-link">Contact</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="cart-header">
            <h1>Shopping Cart</h1>
            <p>Review and manage your items</p>
        </div>

        <div class="cart-content">
            <div class="cart-items-section">
                <h2>Your Items</h2>
                <div id="cart-container">
                    <p class="empty-message">Your cart is empty</p>
                </div>
            </div>

            <div class="cart-summary">
                <h2>Order Summary</h2>
                <div class="summary-item">
                    <span>Subtotal:</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="summary-item">
                    <span>Shipping:</span>
                    <span id="shipping">$5.00</span>
                </div>
                <div class="summary-item">
                    <span>Tax:</span>
                    <span id="tax">$0.00</span>
                </div>
                <div class="summary-item total">
                    <span>Total:</span>
                    <span id="total">$5.00</span>
                </div>
                <button class="checkout-btn">Proceed to Checkout</button>
                <a href="shop.html" class="continue-shopping">Continue Shopping</a>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2024 mySTORE. All rights reserved. | Spend less, get and enjoy more!</p>
    </footer>

    <script src="js/cart.js"></script>
</body>

</html>
